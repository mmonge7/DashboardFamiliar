# Servidor de Casa: Home Assistant + la API de la app + el exportador de la compra.
# En la carpeta servidor/:  docker compose up -d
# Todo usa la red del equipo y escucha SOLO en 127.0.0.1; Tailscale lo publica en tu red privada (ver README).
services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Europe/Madrid
    network_mode: host
    restart: unless-stopped

  casa-api:
    container_name: casa-api
    image: python:3.12-alpine
    working_dir: /familia
    command: ["python3", "-I", "api/familia_api.py"]
    environment:
      FAMILIA_CONFIG: /familia/config/familia.json
      TZ: Europe/Madrid
    volumes:
      - .:/familia:ro
      - ./estado:/familia/estado   # para rehacer compra.json al tachar o añadir desde la app
    network_mode: host
    restart: unless-stopped
    read_only: true
    user: "1000:1000"

  casa-compra:
    container_name: casa-compra
    image: python:3.12-alpine
    working_dir: /familia
    command: ["sh", "despliegue/compra_loop.sh"]
    environment:
      FAMILIA_CONFIG: /familia/config/familia.json
      TZ: Europe/Madrid
    volumes:
      - .:/familia
    network_mode: host
    restart: unless-stopped
    user: "1000:1000"
    depends_on: [homeassistant]
